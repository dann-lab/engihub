[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Allow Netlify Functions to be called without rewriting to index.html
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Proxy /api requests to Netlify AI function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/ai"
  status = 200

# Client-side SPA routing: redirect all page requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
